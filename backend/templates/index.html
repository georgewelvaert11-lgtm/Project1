<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phrasal Verb Practice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Phrasal Verb Practice</h1>

    <p id="overall-progress"></p>

    <nav id="step-nav">
        <button id="nav-step1-btn" type="button" class="nav-btn">Step 1: Learn</button>
        <button id="nav-step2-btn" type="button" class="nav-btn" disabled>Step 2: Practice</button>
    </nav>

    <div id="step1">
        <div class="dialogue" id="dialogue-box"></div>

        <form id="guess-form">
            <label for="guess" id="guess-label"></label>
            <input type="text" id="guess" name="guess" autocomplete="off" placeholder="Type your guess in English or Traditional Chinese" required>
            <button type="submit">Reveal meaning</button>
        </form>

        <div id="reveal" class="reveal hidden">
            <p class="your-guess">Your guess: <span id="your-guess-text"></span></p>
            <p class="explanation" id="reveal-explanation"></p>

            <div id="reveal-extras">
                <button id="show-zh-btn" type="button">顯示繁體中文</button>
                <button id="show-explain-btn" type="button">Longer explanation</button>
                <button id="show-example-btn" type="button">Another example</button>
            </div>

            <p id="reveal-zh" class="extra-result hidden"></p>
            <p id="explain-result" class="extra-result hidden"></p>
            <p id="example-result" class="extra-result hidden"></p>
        </div>

        <div id="step1-controls" class="hidden">
            <button id="next-phrase-btn" type="button">Next phrase</button>
        </div>

        <div id="all-learned" class="reveal hidden">
            <p>🎉 You've learned all {{ phrases | length }} phrases! Head to Step 2 to keep practicing.</p>
        </div>
    </div>

    <div id="step2" class="hidden">
        <p id="discrimination-sentence"></p>
        <div id="discrimination-options"></div>
        <div id="discrimination-feedback" class="hidden"></div>
        <button id="new-round-btn" type="button" class="hidden">Next round</button>
    </div>

    <script>
        const PHRASES = {{ phrases | tojson }};
        const SEEN_IDS = {{ seen_ids | tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
