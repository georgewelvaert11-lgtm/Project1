<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phrasal Verb Practice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Phrasal Verb Practice</h1>

    <div class="dialogue">
        <p><span class="speaker">A:</span> I need to <strong>figure out</strong> what's going on with this bill.</p>
        <p><span class="speaker">B:</span> Yeah, it's confusing — let's look into it together.</p>
    </div>

    <form id="guess-form">
        <label for="guess">What do you think "figure out" means here? (English or 繁體中文)</label>
        <input type="text" id="guess" name="guess" autocomplete="off" placeholder="Type your guess in English or Traditional Chinese" required>
        <button type="submit">Reveal meaning</button>
    </form>

    <div id="reveal" class="reveal hidden">
        <p class="your-guess">Your guess: <span id="your-guess-text"></span></p>
        <p class="explanation">
            <strong>Phrasal verb:</strong> "figure out" — to understand or solve something.
        </p>
    </div>

    <div id="chat" class="chat hidden">
        <h2>Now practice using it</h2>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form">
            <input type="text" id="chat-input" autocomplete="off" placeholder="Type your reply...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
