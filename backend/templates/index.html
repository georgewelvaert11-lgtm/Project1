<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phrasal Verb Practice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Phrasal Verb Practice</h1>

    <div id="step1">
        <h2>Step 1: Learn phrases</h2>
        <p id="phrase-progress"></p>

        <div class="dialogue" id="dialogue-box"></div>

        <form id="guess-form">
            <label for="guess" id="guess-label"></label>
            <input type="text" id="guess" name="guess" autocomplete="off" placeholder="Type your guess in English or Traditional Chinese" required>
            <button type="submit">Reveal meaning</button>
        </form>

        <div id="reveal" class="reveal hidden">
            <p class="your-guess">Your guess: <span id="your-guess-text"></span></p>
            <p class="explanation" id="reveal-explanation"></p>
        </div>

        <div id="step1-controls" class="hidden">
            <button id="next-phrase-btn" type="button">Next phrase</button>
            <button id="to-step2-btn" type="button" class="hidden">Continue to Step 2 →</button>
        </div>
    </div>

    <div id="step2" class="hidden">
        <h2>Step 2: Match the phrase</h2>
        <p id="discrimination-sentence"></p>
        <div id="discrimination-options"></div>
        <div id="discrimination-feedback" class="hidden"></div>
        <button id="new-round-btn" type="button" class="hidden">Next round</button>
    </div>

    <script>
        const PHRASES = {{ phrases | tojson }};
        const SEEN_IDS = {{ seen_ids | tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
