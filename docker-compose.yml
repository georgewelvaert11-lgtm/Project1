services:
  web:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - progress-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  progress-data:
